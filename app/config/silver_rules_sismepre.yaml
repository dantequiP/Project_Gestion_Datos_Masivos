    preserve_zero_values:
      FORMULARIO_ID:
        reason: "El valor 0 se conserva como valor observado de la fuente; no se convierte a null."
      MON_AUTOAVALUO_INAFECTO:
        reason: "El valor 0 puede representar un monto válido; no se convierte a null."
      MON_BASEIMPONIBLE_AFECTO:
        reason: "El valor 0 puede representar un monto válido; no se convierte a null."
      MON_BASEIMPONIBLE_EXON:
        reason: "El valor 0 puede representar un monto válido; no se convierte a null."
      MON_EMISIONPREDIAL_AFECTO:
