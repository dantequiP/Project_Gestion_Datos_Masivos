        reason: "Columna 100% vacía en Bronze, pero se conserva como string nullable por posible utilidad futura o llenado posterior de la fuente."
      FLAG_EMILIQUIDA:
        reason: "Columna mayormente vacía; se conserva porque representa un indicador tributario cuando aplica."
      FLAG_EMISION_INICIAL:
