# ============================================================
# config.yaml — Configuración central del pipeline RAW
# Proyecto: Arquitectura Medallion — Capa Bronze (RAW)
# ============================================================

project:
  name: "proyecto_datos_masivos"
  version: "1.0.0"
  layer: "bronze"
  description: "Pipeline de ingestión RAW — datos exactamente como vienen de la fuente"

# ---- Rutas -------------------------------------------------
paths:
  data_root: "data"
  bronze_root: "data/bronze"
  audit_root: "data/audit"
  logs_root: "logs"

# ---- HTTP --------------------------------------------------
http:
  timeout: 180         # 180s: el MEF tarda en responder páginas grandes
  max_retries: 5       # 5 reintentos = 6 intentos totales (antes eran 3 reintentos)
  backoff_factor: 3    # espera: 3s, 9s, 27s, 81s, 243s — más paciente con el 500
  headers:
    User-Agent: "DataEngineeringPipeline/1.0 (academic research)"
    Accept: "application/json, text/csv, */*"

# ---- CKAN --------------------------------------------------
ckan:
  page_limit: 500      # Bajado desde 10000: el MEF devuelve 500 con páginas grandes
  base_url: "https://api.datosabiertos.mef.gob.pe/DatosAbiertos/v1/datastore_search"

# ---- Parquet -----------------------------------------------
parquet:
  engine: "pyarrow"
  compression: "snappy"   # snappy mantiene velocidad y compatibilidad
  # ¡NO se aplica ningún schema forzado — tipos originales preservados!

