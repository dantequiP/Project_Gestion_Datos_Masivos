# ============================================================
# REGLAS SILVER - RENAMU 2022
# ============================================================
# Fuente única: municipalidades_2022 (1,874 filas x 1,368 cols)
#
# Origen de decisiones:
# - integer_columns (1047): inferred_type=integer y
#   numeric_valid_pct>=98 según renamu_profile_detail.csv.
# - decimal_columns (1): P04_6 es la única columna con valores
#   decimales (distancia en km, 93.4% vacíos estructurales).
# - preserve_as_string: ccdd/ccpp/ccdi/Ubigeo/Tipomuni conservan
#   tipo texto por convención de códigos geográficos INEI.
#   CRÍTICO — Ubigeo: min numérico=10101 ('010101'→10101
#   si se convierte a integer; cero inicial se pierde).
# - drop_columns (94): VFI constantes (unique_count=1, valor
#   siempre '1') confirmadas por profiling.
# - documented_null_columns: 6 columnas _O (vacíos estructurales
#   por diseño del cuestionario — solo se llenan al elegir 'Otro').
# - Sin special_values_to_null: profiling confirma ausencia de
#   valores 99/999 en columnas numéricas.
# - anio_periodo_key deshabilitada: RENAMU no tiene ANO_APLICACION
#   ni PERIODO; el año es la columna literal "Año" (integer, 2022).
# ============================================================

source_system: "RENAMU"

silver_defaults:
  bronze_base_path: "data/bronze/renamu"
  bronze_subfolder: "2022_municipalidades__Base_RENAMU_2022_f"
  silver_base_path: "data/silver/renamu"
  reports_base_path: "reports/silver/renamu"
  audit_base_path: "data/audit/silver"

  add_technical_columns: true

  technical_columns:
    source_system:
      value: "RENAMU"
      description: "Sistema de origen (Registro Nacional de Municipalidades — INEI)."
    source_dataset:
      description: "Nombre del dataset de origen."
    silver_processed_at:
      description: "Fecha y hora en que el registro fue procesado hacia Silver."
    record_hash:
      description: "Huella SHA-256 del registro para trazabilidad y detección de cambios."
    anio_periodo_key:
      description: "No aplica para RENAMU (disabled via derived_columns.anio_periodo_key.enabled=false)."

  null_handling:
    convert_missing_tokens_to_null: true
    missing_tokens:
      - ""
      - " "
      - "NULL"
      - "null"
      - "None"
      - "none"
      - "NaN"
      - "nan"
      - "N/A"
      - "n/a"

  row_policy:
    drop_empty_rows: true
    drop_duplicate_rows: false
    impute_missing_values: false

  keep_original_column_names: true


datasets:

  municipalidades_2022:

    # ----------------------------------------------------------
